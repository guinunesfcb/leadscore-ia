name: CI - Lint & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Build
        env:
          DATABASE_URL: "postgresql://dummy_ci_user:dummy_ci_pass@localhost:5432/dummy_ci_db"
          GEMINI_API_KEY: "dummy_ci_key"
          GEMINI_MODEL: "gemini-3.8-flash"
        run: npm run build

